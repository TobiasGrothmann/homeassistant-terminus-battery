[project]
name = "homeassistant-terminus-battery"
version = "0.1.1"
description = "Home Assistant integration for TRMNL devices served by a self-hosted Terminus (BYOS) server"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.trmnl_terminus"]
combine-as-imports = true
